<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title description">
  <title id="title">AgriSage AI architecture</title>
  <desc id="description">Extension officer workflow through a Next.js frontend, FastAPI, LangGraph, open-weight model, MCP tools, deterministic risk engine, evidence chain, database and officer approval.</desc>
  <defs>
    <pattern id="graph-paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e7e7e7" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111111"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111111"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111111"/></marker>
    <style>
      text { font-family: Arial, "Segoe UI", sans-serif; fill: #111111; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 18px; }
      .tag { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; }
      .darkTag { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; fill: #111111; }
      .darkHeading { font-size: 22px; font-weight: 700; fill: #111111; }
      .darkBody { font-size: 15px; fill: #111111; }
      .edge { fill: none; stroke: #111111; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; }
      .blueEdge { fill: none; stroke: #111111; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; }
      .amberEdge { fill: none; stroke: #111111; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: round; stroke-dasharray: 10 8; }
      .edgeLabel { font-size: 13px; font-weight: 650; fill: #111111; }
      .labelBg { fill: #ffffff; opacity: .96; }
      rect:not(.canvas):not(.labelBg) { fill: #ffffff !important; stroke: #111111 !important; stroke-width: 2px !important; }
      .tag, .edgeLabel { fill: #111111 !important; }
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120" fill="#ffffff"/>
  <rect class="canvas" width="1800" height="1120" fill="url(#graph-paper)"/>
  <text x="70" y="76" class="title">AgriSage AI · Evidence Before Advice</text>
  <text x="72" y="110" class="subtitle">Climate-smart farm investigation with traceable evidence and named officer approval</text>

  <!-- Connectors are drawn first so every card stays legible. -->
  <path d="M320 242H375" class="edge" marker-end="url(#arrow)"/>
  <path d="M665 242H720" class="edge" marker-end="url(#arrow)"/>
  <path d="M1010 242H1070" class="edge" marker-end="url(#arrow)"/>
  <path d="M1490 242H1540" class="blueEdge" marker-end="url(#arrowBlue)"/>
  <path d="M1265 320V378H340V455" class="edge" marker-end="url(#arrow)"/>
  <path d="M500 555H610V515H660" class="edge" marker-end="url(#arrow)"/>
  <path d="M500 555H565V425H1315V455" class="blueEdge" marker-end="url(#arrowBlue)"/>
  <path d="M1490 555H1520" class="blueEdge" marker-end="url(#arrowBlue)"/>
  <path d="M835 625V705H300V770" class="edge" marker-end="url(#arrow)"/>
  <path d="M1130 320V700H675V770" class="edge" marker-end="url(#arrow)"/>
  <path d="M840 845H900" class="edge" marker-end="url(#arrow)"/>
  <path d="M1240 845H1300" class="edge" marker-end="url(#arrow)"/>
  <path d="M720 320V350H40V880H60" class="edge" marker-end="url(#arrow)"/>
  <path d="M1500 770V710H1760V365H865V320" class="amberEdge" marker-end="url(#arrowAmber)"/>

  <!-- User and application flow -->
  <rect x="60" y="170" width="260" height="150" rx="18" fill="#ffffff" stroke="#bed3c4" stroke-width="2"/>
  <text x="86" y="207" class="tag">HUMAN USER</text>
  <text x="86" y="243" class="heading">Extension officer</text>
  <text x="86" y="276" class="body">Selects scope and reviews</text>
  <text x="86" y="300" class="body">evidence and draft advice</text>

  <rect x="375" y="170" width="290" height="150" rx="18" fill="#eaf2eb" stroke="#9fbea7" stroke-width="2"/>
  <text x="401" y="207" class="tag">FRONTEND</text>
  <text x="401" y="243" class="heading">Next.js workspace</text>
  <text x="401" y="276" class="body">Overview · priority queue</text>
  <text x="401" y="300" class="body">Evidence · traces · review</text>

  <rect x="720" y="170" width="290" height="150" rx="18" fill="#ffffff" stroke="#bed3c4" stroke-width="2"/>
  <text x="746" y="207" class="tag">BACKEND</text>
  <text x="746" y="243" class="heading">FastAPI + SQLAlchemy</text>
  <text x="746" y="276" class="body">Validates requests</text>
  <text x="746" y="300" class="body">Persists runs and decisions</text>

  <rect x="1070" y="160" width="420" height="160" rx="18" fill="#174d37" stroke="#174d37" stroke-width="2"/>
  <text x="1100" y="198" class="darkTag">ORCHESTRATOR</text>
  <text x="1100" y="235" class="darkHeading">LangGraph workflow</text>
  <text x="1100" y="270" class="darkBody">Plan · retrieve · validate · rank · draft</text>
  <text x="1100" y="296" class="darkBody">Missing-data path · approval stop</text>

  <rect x="1540" y="170" width="200" height="150" rx="18" fill="#edf3f7" stroke="#b7cad8" stroke-width="2"/>
  <text x="1562" y="207" class="tag" fill="#547c9e">OPEN-WEIGHT</text>
  <text x="1562" y="243" class="heading">Qwen3</text>
  <text x="1562" y="276" class="body">Ollama or hosted</text>
  <text x="1562" y="300" class="body">compatible endpoint</text>

  <!-- MCP process boundary -->
  <rect x="200" y="455" width="300" height="170" rx="18" fill="#ffffff" stroke="#bed3c4" stroke-width="2"/>
  <text x="226" y="492" class="tag">MCP CLIENT</text>
  <text x="226" y="528" class="heading">Python SDK · stdio</text>
  <text x="226" y="561" class="body">Starts and calls each server</text>
  <text x="226" y="587" class="body">Logs input, output, timing,</text>
  <text x="226" y="611" class="body">status, and failures</text>

  <rect x="660" y="455" width="350" height="170" rx="18" fill="#eaf2eb" stroke="#9fbea7" stroke-width="2"/>
  <text x="686" y="492" class="tag">FIRST-PARTY MCP SERVER</text>
  <text x="686" y="528" class="heading">AgriSage tools</text>
  <text x="686" y="561" class="body">Plot · climate · pest evidence</text>
  <text x="686" y="587" class="body">Follow-up · advisory draft</text>
  <text x="686" y="611" class="small">Drafts stop at PENDING_APPROVAL</text>

  <rect x="1140" y="455" width="350" height="170" rx="18" fill="#edf3f7" stroke="#b7cad8" stroke-width="2"/>
  <text x="1166" y="492" class="tag" fill="#547c9e">BORROWED MCP SERVER</text>
  <text x="1166" y="528" class="heading">Official Fetch</text>
  <text x="1166" y="561" class="body">Generic public web retrieval</text>
  <text x="1166" y="587" class="body">Optional context only</text>
  <text x="1166" y="611" class="small">Fetch errors are traced</text>

  <rect x="1520" y="455" width="220" height="170" rx="18" fill="#ffffff" stroke="#b7cad8" stroke-width="2"/>
  <text x="1542" y="492" class="tag" fill="#547c9e">PUBLIC SOURCE</text>
  <text x="1542" y="528" class="heading">FAO reference</text>
  <text x="1542" y="561" class="body">Climate-smart</text>
  <text x="1542" y="587" class="body">agriculture page</text>
  <text x="1542" y="611" class="small">Optional context</text>

  <!-- Data, deterministic assessment, and review -->
  <rect x="60" y="770" width="390" height="210" rx="18" fill="#ffffff" stroke="#bed3c4" stroke-width="2"/>
  <text x="88" y="808" class="tag">SQLALCHEMY · SQLITE / POSTGRESQL</text>
  <text x="88" y="846" class="heading">AgriSage database</text>
  <text x="88" y="880" class="body">Synthetic farms · climate · pest signals</text>
  <text x="88" y="908" class="body">Runs · tool logs · evidence · risk</text>
  <text x="88" y="936" class="body">Advisories · follow-ups · approvals · evals</text>
  <text x="88" y="962" class="small">Seeds only when no farm records exist</text>

  <rect x="500" y="770" width="340" height="150" rx="18" fill="#fff5e4" stroke="#dfc18d" stroke-width="2"/>
  <text x="528" y="808" class="tag" fill="#9b671a">DETERMINISTIC CODE</text>
  <text x="528" y="846" class="heading">Risk engine</text>
  <text x="528" y="880" class="body">Freshness · evidence gaps</text>
  <text x="528" y="906" class="body">Risk factors · confidence · rank</text>

  <rect x="900" y="770" width="340" height="150" rx="18" fill="#eaf2eb" stroke="#9fbea7" stroke-width="2"/>
  <text x="928" y="808" class="tag">REVIEWABLE OUTPUT</text>
  <text x="928" y="846" class="heading">Evidence chain</text>
  <text x="928" y="880" class="body">Source · factor · missing data</text>
  <text x="928" y="906" class="body">Farm priority queue</text>

  <rect x="1300" y="770" width="440" height="150" rx="18" fill="#fff5e4" stroke="#dfc18d" stroke-width="2"/>
  <text x="1328" y="808" class="tag" fill="#9b671a">HUMAN APPROVAL</text>
  <text x="1328" y="846" class="heading">Advisory review</text>
  <text x="1328" y="880" class="body">Approve · edit · reject through API</text>
  <text x="1328" y="906" class="body">Named officer and timestamp are saved</text>

  <!-- Connector labels sit on clean background strips. -->
  <rect x="625" y="389" width="224" height="25" rx="8" class="labelBg"/>
  <text x="638" y="407" class="edgeLabel">MCP calls over stdio</text>
  <rect x="815" y="397" width="139" height="24" rx="8" class="labelBg"/>
  <text x="827" y="414" class="edgeLabel">Fetch request</text>
  <rect x="455" y="665" width="260" height="24" rx="8" class="labelBg"/>
  <text x="468" y="682" class="edgeLabel">Agriculture records and actions</text>
  <rect x="845" y="686" width="230" height="24" rx="8" class="labelBg"/>
  <text x="858" y="703" class="edgeLabel">Structured assessment</text>
  <rect x="1308" y="335" width="300" height="24" rx="8" class="labelBg"/>
  <text x="1320" y="352" class="edgeLabel" fill="#9b671a">Officer decision returns through API</text>
  <rect x="75" y="356" width="151" height="24" rx="8" class="labelBg"/>
  <text x="86" y="373" class="edgeLabel">API persistence</text>

  <text x="70" y="1050" class="small">Synthetic demonstration data · external reference is optional · the agent never sends an advisory to a farmer</text>
</svg>
